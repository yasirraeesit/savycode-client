<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Brand Gradient identical to Navbar: from-[#00D2FF] to-[#6366F1] -->
    <linearGradient id="sovyBrandGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00D2FF" />
      <stop offset="48%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>

    <!-- Subtle Premium Shadow Filter -->
    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#00D2FF" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Rounded Squircle Icon Base -->
  <rect 
    x="32" 
    y="32" 
    width="448" 
    height="448" 
    rx="124" 
    fill="url(#sovyBrandGrad)" 
    filter="url(#subtleShadow)"
  />

  <!-- Subtle Inner Glass Top Highlight -->
  <path 
    d="M 32 156 C 32 88 88 32 156 32 L 356 32 C 424 32 480 88 480 156 L 480 200 C 400 160 200 150 32 260 Z" 
    fill="#FFFFFF" 
    opacity="0.12" 
  />

  <!-- The Exact SovYCode Double Slashes (//) -->
  <!-- Slash 1 (Left) -->
  <line 
    x1="175" 
    y1="368" 
    x2="245" 
    y2="144" 
    stroke="#07090E" 
    stroke-width="54" 
    stroke-linecap="round" 
  />

  <!-- Slash 2 (Right) -->
  <line 
    x1="267" 
    y1="368" 
    x2="337" 
    y2="144" 
    stroke="#07090E" 
    stroke-width="54" 
    stroke-linecap="round" 
  />
</svg>